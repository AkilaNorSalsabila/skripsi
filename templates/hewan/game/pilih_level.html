<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Level Game</title>

  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hewan/pilih_level.css') }}">
</head>


<body>

  <img src="{{ url_for('static', filename='img/hewan/desain/monyet.png') }}" class="decor monkey" alt="Monyet">
  <img src="{{ url_for('static', filename='img/hewan/desain/burung.png') }}" class="decor bird" alt="Burung">
  <div class="grass"></div>
  <a href="/permainan" class="back-button" >
      <img src="{{ url_for('static', filename='img/hewan/desain/back.png') }}" alt="Kembali">
    </a>


  <div class="lang-select">
    <div id="selected-lang" class="selected" aria-haspopup="true" aria-expanded="false">
      <img src="/static/img/flag indo.png" alt="ID"><span>Indonesia</span>
    </div>
    <div id="lang-options" class="options hidden" role="menu">
      <div role="menuitem" onclick="setLanguage('id', event)" class="lang-option">
        <img src="/static/img/flag indo.png" alt="ID"><span>Indonesia</span>
      </div>
      <div role="menuitem" onclick="setLanguage('en', event)" class="lang-option">
        <img src="/static/img/flag uk.png" alt="EN"><span>English</span>
      </div>
    </div>
  </div>


  <div class="content">
  <audio id="clickSound" src="{{ url_for('static', filename='sounds/sound-click.mp3') }}"></audio>
  <audio id="bgMusic" src="{{ url_for('static', filename='sounds/hewan/effect/1.mp3') }}" loop></audio>

    <h1 id="title">LEVEL GAME</h1>

    <div class="level-buttons">
      <div id="btn-easy" class="card-wrapper" onclick="playAndGo('/hewan_mudah')">
        <div class="card">
          <img src="{{ url_for('static', filename='img/hewan/desain/tebak.png') }}" alt="Mengenal Hewan">
        </div>
        <div class="label" id="label-mudah">Tebak Nama</div>
      </div>
      <div id="btn-medium" class="card-wrapper" onclick="playAndGo('/hewan_menengah')">
        <div class="card">
          <img src="{{ url_for('static', filename='img/hewan/desain/mencocokkan.png') }}" alt="Cocokkan Hewan">
        </div>
        <div class="label" id="label-menengah">Tebak Bentuk</div>
      </div>
      <div id="btn-hard" class="card-wrapper" onclick="playAndGo('/hewan_sulit')">
        <div class="card">
          <img src="{{ url_for('static', filename='img/hewan/desain/puzzle.png') }}" alt="Puzzle Hewan">
        </div>
        <div class="label" id="label-sulit">Puzzle</div>
      </div>
    </div>
  </div>
  
  <script src="{{ url_for('static', filename='js/level_hewan.js') }}"></script>
  <script>
    const clickSound = document.getElementById("clickSound");
    const bgMusic = document.getElementById("bgMusic");
    bgMusic.volume = 0.1;
    bgMusic.play().catch(err => console.log("BG music error:", err));

    function playAndGo(url) {
      clickSound.currentTime = 0;
      clickSound.play().catch(err => console.log(err));
      setTimeout(() => {
        window.location.href = url;
      }, 500);
    }
    document.addEventListener("click", function (e) {
  if (e.target.closest("button, a")) {
    clickSound.currentTime = 0;
    clickSound.play();
  }
});

  </script>

</body>
</html>

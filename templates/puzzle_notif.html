<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notif Puzzle Benar</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mudah_notif.css') }}">
  <style>
    #veg-name { display: inline-block; white-space: pre; }
    .syllable {
      display: inline-block;
      padding: 0 !important; margin: 0 !important;
      transition: all 0.2s ease;
    }
    .syllable.active {
      color: #FFCA3A !important;
      transform: scale(1.2);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <img src="{{ url_for('static', filename='img/vegetables_corner1.png') }}" class="decor decor-left">
  <img src="{{ url_for('static', filename='img/vegetables_corner_top1.png') }}" class="decor decor-right">

  <header class="notif-header">
    <h1>
      <span id="notif-text"></span><br>
      <span id="veg-name"></span>
    </h1>
    <button id="btn-speak" class="speak-btn">
      <img src="{{ url_for('static', filename='img/sound.png') }}">
    </button>
  </header>

  <main class="notif-main">
    <div class="veg-frame">
      <img id="notif-veg" src="">
    </div>
  </main>

  <div id="confetti-container"><canvas id="confetti"></canvas></div>
  <audio id="id-player"></audio>

  <script>
    // --- CONFETTI ---
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const pieces = [];
    const colors = ["#FF595E","#FFCA3A","#8AC926","#1982C4","#6A4C93"];
    let timeUp = false;

    for (let i = 0; i < 150; i++) {
      pieces.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        w: 8, h: 14,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: 2 + Math.random() * 3,
        rotate: Math.random() * 360,
        dr: Math.random() * 10
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotate * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
        p.y += p.speed; p.rotate += p.dr;
        if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
      });
      if (!timeUp) requestAnimationFrame(draw);
    }
    draw();

    // --- DATA & AUDIO ---
    const lang    = localStorage.getItem("gameLang") || "id";
    const vegData = JSON.parse(localStorage.getItem("notifVeg"));
    const player  = document.getElementById("id-player");
    let activeTimeouts = [];

    // ✅ LENGKAP: Timing ejaan semua sayuran
    const spellingTimings = {
      "id": {
        "brokoli":        [0, 0.7, 1.4],
        "oyong":          [0, 0.8],
        "jantung pisang": [0, 0.6, 1.1, 1.6],
        "bawang bombay":  [0, 0.6, 1.2, 1.8],
        "kubis":          [0, 0.8],
        "mentimun":       [0, 0.7, 1.4],
        "wortel":         [0, 0.8],
        "tomat":          [0, 0.8],
        "paprika":        [0, 0.7, 1.4],
        "bayam":          [0, 0.8],
        "kangkung":       [0, 0.9],
        "selada":         [0, 0.7, 1.4],
        "lobak":          [0, 0.8],
        "kentang":        [0, 0.8],
        "rebung":         [0, 1],
        "asparagus":      [1.0, 1.8, 2.6, 3.4],
        "seledri":        [0.4, 0.9, 1.8],
        "buncis":         [0, 0.8],
        "terong":         [0, 0.8],
        "sawi hijau":     [0, 0.6, 1.2, 1.8],
        "sawi putih":     [0, 0.6, 1.2, 1.8],
        "bit merah":      [0, 0.7, 1.2],
        "jamur kancing":  [0, 0.6, 1.1, 1.6],
        "bawang merah":   [0, 0.6, 1.1, 1.6],
        "bawang putih":   [0, 0.6, 1.2, 1.8],
        "bawang daun":    [0, 0.8, 1.2, 1.7],
        "cabai rawit":    [0, 0.6, 1.4, 1.9],
        "daun pakis":     [0, 0.6, 1.1, 1.6],
        "labu siam":      [0, 0.6, 1.1, 1.6],
        "kacang panjang": [0, 0.6, 1.1, 1.6],
        "default":        [0, 0.8, 1.6]
      },
      "en": {
        "broccoli":        [0, 0.7, 1.4],
        "cabbage":         [0, 0.8],
        "cucumber":        [0, 1.0, 2.6],
        "carrot":          [0, 1.2],
        "tomato":          [0, 0.8, 1.4],
        "bell pepper":     [0, 1.1, 2.2],
        "spinach":         [0, 0.8],
        "water spinach":   [0, 1.1, 2.2, 3.3],
        "mustard greens":  [0, 0.9, 1.6],
        "chinese cabbage": [0, 1.0, 2.0, 2.4],
        "lettuce":         [0, 1.9],
        "radish":          [0, 1.2],
        "potato":          [0, 0.6, 1.2],
        "beetroot":        [0, 2],
        "button mushroom": [0, 1.2, 2.4, 3.6],
        "shallot":         [0, 0.8],
        "garlic":          [0, 1.4],
        "onion":           [0, 1.7],
        "leek":            [0],
        "bird's eye chili":[0, 2.8, 4],
        "banana blossom":  [0, 1.1, 2.2, 3.3, 4.4],
        "bamboo shoot":    [0, 0.9, 1.6],
        "fiddlehead fern": [0, 1.3, 2.6, 3.9],
        "asparagus":       [0, 0.8, 1.8, 2.8],
        "luffa":           [0, 1],
        "ridge gourd":     [0, 0.8, 1.6],
        "chayote":         [0, 1.4, 2.3],
        "celery":          [0, 1],
        "green beans":     [0, 0.8],
        "yardlong beans":  [0, 1.5, 2.3],
        "eggplant":        [0, 1],
        "default":         [0, 0.8, 1.6]
      }
    };

    // ✅ LENGKAP: Pemisah suku kata semua sayuran
    const manualSplit = {
      // Indonesia
      "brokoli":        ["Bro","ko","li"],
      "oyong":          ["O","yong"],
      "jantung pisang": ["Jan","tung"," Pi","sang"],
      "bawang bombay":  ["Ba","wang"," Bom","bay"],
      "kubis":          ["Ku","bis"],
      "mentimun":       ["Men","ti","mun"],
      "wortel":         ["Wor","tel"],
      "tomat":          ["To","mat"],
      "paprika":        ["Pa","pri","ka"],
      "bayam":          ["Ba","yam"],
      "kangkung":       ["Kang","kung"],
      "selada":         ["Se","la","da"],
      "lobak":          ["Lo","bak"],
      "kentang":        ["Ken","tang"],
      "rebung":         ["Re","bung"],
      "asparagus":      ["As","pa","ra","gus"],
      "seledri":        ["Se","le","dri"],
      "buncis":         ["Bun","cis"],
      "terong":         ["Te","rong"],
      "sawi hijau":     ["Sa","wi"," Hi","jau"],
      "sawi putih":     ["Sa","wi"," Pu","tih"],
      "bit merah":      ["Bit"," Me","rah"],
      "jamur kancing":  ["Ja","mur"," Kan","cing"],
      "bawang merah":   ["Ba","wang"," Me","rah"],
      "bawang putih":   ["Ba","wang"," Pu","tih"],
      "bawang daun":    ["Ba","wang"," Da","un"],
      "cabai rawit":    ["Ca","bai"," Ra","wit"],
      "daun pakis":     ["Da","un"," Pa","kis"],
      "labu siam":      ["La","bu"," Si","am"],
      "kacang panjang": ["Ka","cang"," Pan","jang"],
      // English
      "broccoli":        ["Broc","co","li"],
      "cabbage":         ["Cab","bage"],
      "cucumber":        ["Cu","cum","ber"],
      "carrot":          ["Car","rot"],
      "tomato":          ["To","ma","to"],
      "bell pepper":     ["Bell"," Pep","per"],
      "spinach":         ["Spi","nach"],
      "water spinach":   ["Wa","ter"," Spi","nach"],
      "mustard greens":  ["Mus","tard"," Greens"],
      "chinese cabbage": ["Chi","nese"," Cab","bage"],
      "lettuce":         ["Let","tuce"],
      "radish":          ["Ra","dish"],
      "potato":          ["Po","ta","to"],
      "beetroot":        ["Beet","root"],
      "button mushroom": ["But","ton"," Mush","room"],
      "shallot":         ["Shal","lot"],
      "garlic":          ["Gar","lic"],
      "onion":           ["On","ion"],
      "leek":            ["Leek"],
      "bird's eye chili":["Bird's"," Eye"," Chili"],
      "banana blossom":  ["Ba","na","na"," Blos","som"],
      "bamboo shoot":    ["Bam","boo"," Shoot"],
      "fiddlehead fern": ["Fid","dle","head"," Fern"],
      "luffa":           ["Luf","fa"],
      "ridge gourd":     ["Ridge"," Gourd"],
      "chayote":         ["Cha","yo","te"],
      "celery":          ["Cel","ery"],
      "green beans":     ["Green"," Beans"],
      "yardlong beans":  ["Yard","long"," Beans"],
      "eggplant":        ["Egg","plant"]
    };

    function renderSyllables(displayName) {
      const container = document.getElementById("veg-name");
      container.innerHTML = "";
      const syls = manualSplit[displayName.toLowerCase()] || [displayName];
      syls.forEach(s => {
        const span = document.createElement("span");
        span.className = "syllable";
        span.textContent = s;
        container.appendChild(span);
      });
    }

    function playSequence() {
      if (!vegData) return;
      activeTimeouts.forEach(clearTimeout);
      activeTimeouts = [];

      // ✅ Suara "Benar!" / "Correct!" tetap dipakai untuk audio
      player.src = (lang === "en")
        ? "/static/sounds/En/Benar2.mp3"
        : "/static/sounds/id/notif_puzzle/Benar.mp4";
      player.play();

      player.onended = () => {
        const rawId = vegData.id.trim();
        const rawEn = vegData.en.trim();

        function capitalize(name) {
          return name.charAt(0).toUpperCase() + name.slice(1);
        }

        let fileName = (lang === "en") ? rawEn : capitalize(rawId);
        let folder   = (lang === "en")
          ? "/static/sounds/En/Notif_Menengah/"
          : "/static/sounds/id/notif_mudah/";
        let ext = (lang === "en") ? ".mp3" : ".mp4";

        player.src = folder + encodeURIComponent(fileName) + ext;
        player.play();

        const spans  = document.querySelectorAll(".syllable");
        const lowKey = ((lang === "en") ? rawEn : rawId).toLowerCase();
        const langGroup = spellingTimings[lang] || spellingTimings["id"];
        const times  = langGroup[lowKey] || langGroup["default"];

        spans.forEach(s => s.classList.remove("active"));
        times.forEach((t, i) => {
          const tout = setTimeout(() => {
            spans.forEach(s => s.classList.remove("active"));
            if (spans[i]) spans[i].classList.add("active");
          }, t * 1000);
          activeTimeouts.push(tout);
        });

        player.onended = () => {
          setTimeout(() => spans.forEach(s => s.classList.remove("active")), 500);
          player.onended = null;
        };
      };
    }

    window.addEventListener("load", () => {
      if (vegData) {
        const displayName = (lang === "en") ? vegData.en : vegData.id;

        // ✅ Teks "Puzzle Selesai!" / "Puzzle Completed!"
        document.getElementById("notif-text").textContent =
          (lang === "en") ? "Puzzle Completed!" : "Puzzle Selesai!";

        renderSyllables(displayName);
        document.getElementById("notif-veg").src = vegData.img;
        setTimeout(playSequence, 500);
      }
    });

    document.getElementById("btn-speak").addEventListener("click", playSequence);

    // ✅ Setelah 8 detik → cek tujuan berikutnya
    setTimeout(() => {
      timeUp = true;
      const dest = localStorage.getItem("puzzleNotifDest");
      localStorage.removeItem("puzzleNotifDest");

      if (dest === "skor") {
        window.location.href = "/skor";
      } else {
        window.location.href = "/puzzle_next";
      }
    }, 10000);
  </script>
</body>
</html>
